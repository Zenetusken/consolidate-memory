name: Release gate

# The release VERIFY + PROVENANCE teeth (R5, v0.4.2). The two-phase flow:
# ./release.sh --stage opens the release PR → YOU merge it → ./release.sh --finalize
# signs the tag (SSH, `user.signingkey`) and cuts the GitHub Release.
#
# verify:  the candidate tree must pass smoke/sim/manifests, the strict plugin
#          validates (marketplace + both plugins), and every pushed tag must carry
#          a valid SSH signature from the committed public key (.github/release-tag.pub).
#          Threat model: main is PR-only (branch ruleset) and the pubkey is committed —
#          a tag the key didn't sign cannot pass.
# provenance:  builds SLSA provenance + an SPDX SBOM and attaches both to the GitHub
#          Release (create-if-missing — `--finalize`'s `gh release create` may race it).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: verify candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: plugin.json version equals CHANGELOG top heading
        run: |
          python3 - <<'PY'
          import json, re, sys
          from pathlib import Path
          pj = json.loads(Path("plugins/consolidate-memory/.claude-plugin/plugin.json").read_text())
          ver = pj["version"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(r"^## \[(\d+\.\d+\.\d+)\]", text, re.M)
          if not m:
              sys.exit("CHANGELOG.md has no top ## [X.Y.Z] heading")
          top = m.group(1)
          if top != ver:
              sys.exit(f"plugin.json version {ver} != CHANGELOG top {top}")
          print(f"ok: {ver}")
          PY
      - name: smoke + sim + manifests
        run: |
          python3 tests/smoke.py
          python3 tests/simulate_accumulation.py
          python3 tests/validate_manifests.py
      - name: strict plugin validates (marketplace + both plugins)
        timeout-minutes: 15
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate ./plugins/consolidate-memory --strict
          claude plugin validate ./plugins/dream-beta-tester --strict
      - name: verify the tag signature (committed public key)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --tags --force
          git config gpg.format ssh
          # the trust anchor comes from PROTECTED main (PR-only), never the tree being
          # verified — a v-tag pushed from a stale commit could otherwise verify against
          # its own (older or absent) key
          git fetch -q origin main
          printf 'andre.zen799@gmail.com %s\n' "$(git show FETCH_HEAD:.github/release-tag.pub)" > /tmp/allowed-signers
          git config gpg.ssh.allowedSignersFile /tmp/allowed-signers
          git verify-tag "${GITHUB_REF_NAME}"

  provenance:
    name: provenance + SBOM
    runs-on: ubuntu-latest
    needs: verify           # review fix: never publish over a red signature gate
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            plugins/consolidate-memory
            plugins/dream-beta-tester
      - name: SPDX SBOM (stdlib generator)
        run: |
          VER="$(python3 -c "
          import re
          m = re.search(r'^## \[(\d+\.\d+\.\d+)\]', open('CHANGELOG.md').read(), re.M)
          print(m.group(1) if m else '')")"
          python3 tools/make_sbom.py --version "${VER:-${GITHUB_REF_NAME#v}}" --out sbom.spdx.json \
            plugins/consolidate-memory plugins/dream-beta-tester
      - name: SHA256SUMS (stdlib generator, v0.4.5 #152)
        run: |
          python3 tools/make_checksums.py --out SHA256SUMS \
            plugins/consolidate-memory plugins/dream-beta-tester
          sha256sum -c SHA256SUMS >/dev/null && echo "SHA256SUMS verifies"
      - name: upload to the GitHub Release (tag must exist)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # review fix: the tag derives from the CHANGELOG top version — never from
          # GITHUB_REF_NAME (a workflow_dispatch run has a BRANCH name there, and a
          # scratch v*-tag must not mint a release). A missing tag skips the upload.
          TAG="v$(python3 -c "
          import re
          m = re.search(r'^## \[(\d+\.\d+\.\d+)\]', open('CHANGELOG.md').read(), re.M)
          print(m.group(1) if m else '')")"
          [ -n "$TAG" ] || { echo "no CHANGELOG version — skipping the release upload"; exit 0; }
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || { echo "tag $TAG does not exist — skipping the release upload (dispatch run?)"; exit 0; }
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes "consolidate-memory $TAG"
          gh release upload "$TAG" sbom.spdx.json SHA256SUMS --clobber
