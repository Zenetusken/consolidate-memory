name: CodeQL

# Advanced setup — replaces the default setup's per-PR analysis. CodeQL is a
# SECURITY-TAB instrument, not a merge gate: it runs on pushes to main + weekly,
# never on pull_request (a PR-triggered analyze cost ~10 minutes and added nothing
# the 11 required checks don't already gate). The repo's default setup is toggled off in Settings
# (the security tab keeps its default-branch scans via this workflow).
# v4 (2026-09-06): the v3 line rejected the `threat-model` init input as a configuration
# error (the main/weekly run went red) and logs a December-2026 deprecation — the input is
# dropped (the default threat model covers this repo's analysis) and the action is v4.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  # security-events: write is the CodeQL action's own requirement — the analyze step uploads the
  # SARIF results (v4 hard-errors without it; v3 degraded silently). Scoped to THIS workflow only:
  # the repo's least-privilege policy (ci.yml stays contents: read) is untouched elsewhere.
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['actions', 'python']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
