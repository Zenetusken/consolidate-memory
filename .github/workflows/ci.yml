name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege token (CodeQL actions/missing-workflow-permissions): nothing in this
# workflow needs more than read access — the test/browser jobs never push or publish.
permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # The ReDoS guard's behavioural eyJ check cannot bound its own failure time: its mutant family
    # includes an EXPONENTIAL one (two nested bounded quantifiers — it blew a 20s cap at k=200), and
    # no stdlib `re` timeout exists to interrupt a running search. The sibling jobs already carry a
    # 10-minute cap; this one had none, so a regression of that shape would hang a runner for the
    # 6h default instead of failing. 15 minutes is ~18x the job's MEASURED 50s (smoke + manifests +
    # simulation on a 24-core box), so it cannot flake — and the failure MODE is safe either way: a
    # check that cannot finish reading a mutant is a RED job, never a green check.
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          # 3.8/3.9 have no official build for the ubuntu-latest (24.04) runner image
          # (actions/setup-python fails to provision them there) — pin to 22.04, which
          # is documented and confirmed to still carry both. CLAUDE.md's "3.8+ stdlib"
          # claim is a deliberate design floor (see the `from __future__ import
          # annotations` + relative_to/fromisoformat workarounds in memory_status.py),
          # so this matrix exists to actually test it, not just assert it.
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: smoke tests (zero-dependency)
        run: python3 tests/smoke.py
      - name: manifest shape validation (portable, no CLI needed)
        run: python3 tests/validate_manifests.py
      - name: lifecycle accumulation simulation
        run: python3 tests/simulate_accumulation.py

  test-macos:
    name: test (macos python 3.12)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: smoke tests (zero-dependency)
        run: python3 tests/smoke.py
      - name: lifecycle accumulation simulation
        run: python3 tests/simulate_accumulation.py

  concurrency:
    name: concurrency (linux python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: process-level races (Phase 1 subset)
        run: python3 tests/concurrency.py

  bench:
    name: bench (linux python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: capacity SLO corner (measured, not gated)
        run: python3 tests/bench_phase5.py --quick --json bench-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report
          path: bench-report.json

  typecheck:
    name: typecheck (mypy, dev-only contract check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install mypy
      - run: mypy --config-file mypy.ini

  # Its own job rather than a step inside `test`: docs drift is version- and OS-independent,
  # so running it six times in the matrix would only multiply the same answer. What it
  # guards is the class of breakage nothing else can see — a version badge that drifts from
  # plugin.json, a table-of-contents entry pointing at a renamed section, a relative link to
  # a moved file. None of those fail a build; a reader just hits them.
  docs:
    name: docs (badges, links, anchors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: documentation drift gate (zero-dependency)
        run: python3 tests/docs_links.py

  browser:
    name: dashboard (chromium, dev-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install browser test tools (not runtime dependencies)
        run: |
          python3 -m pip install playwright==1.60.0
          python3 -m playwright install --with-deps chromium
      # `shell:` here is required, not decoration. GitHub's default Linux shell is `bash -e {0}` — which
      # sets `-e` but NOT `pipefail` — so a piped step's exit status is the RIGHT-hand command's, and
      # `tee` returns 0 whenever it writes. Measured: `bash -e -c 'exit 7 | tee f'` continues and reports
      # 0, while `bash -eo pipefail -c 'exit 7 | tee f'` reports 7. Note WHAT pipefail returns: the
      # RIGHTMOST NON-ZERO stage's OWN status, never a status of its own — so an earlier draft of this
      # line ("the same with `-eo pipefail` aborts at 1") named the wrong mechanism and matched only
      # the probe's operand. 7 is the probe's `exit 7`; THIS job's failure reports 1 because an uncaught
      # AssertionError exits 1 in Python, which is a fact about the test, not about the shell. Without
      # pipefail the job reports green while its checks fail, and the failure survives only in the
      # uploaded artifact — the repo's own lesson that a pipeline's exit status belongs to its last
      # stage. The test does exit non-zero: dashboard_browser.py raises AssertionError in `main`, which
      # `__main__` calls unwrapped.
      - name: dashboard behavior and responsive layout
        shell: bash -eo pipefail {0}
        run: |
          mkdir -p browser-report
          python3 tests/dashboard_browser.py --out browser-report 2>&1 | tee browser-report/run.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dashboard-browser-report
          path: browser-report/

  manifest:
    name: plugin manifest validation (claude CLI)
    runs-on: ubuntu-latest
    # This job's OWN first real run (PR #79, commit 88efa9e) empirically confirmed
    # `claude plugin validate` needs no API auth in an unauthenticated GitHub Actions
    # runner — all three calls below passed cleanly. That resolves the open question a
    # prior draft of this job flagged as unverified; it is now a REAL, blocking gate
    # (no job- or step-level continue-on-error) — a broken plugin.json/marketplace.json
    # must fail CI, not silently pass behind a safety net proven unnecessary.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate ./plugins/consolidate-memory --strict
      - run: claude plugin validate ./plugins/dream-beta-tester --strict
      - run: claude plugin validate .
