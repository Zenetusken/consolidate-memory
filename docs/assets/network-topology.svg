<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
<title id="title">A memory network with deliberate boundaries</title><desc id="desc">Fictional local topology: work has atlas-api, atlas-web, team-docs; research has eval-lab and model-notes; tools has release-tools and dotfiles. Group release-kit in work selects atlas-api, eval-lab and release-tools across domains. Group api-contract in work selects atlas-api and atlas-web only. Scratch remains unenrolled and local-only. Recipients pull later; stack relevance still applies.</desc>
<style>text{font-family:'Segoe UI',Verdana,Arial,sans-serif;fill:#e5eef5}.muted{fill:#96abc2}.cyan{fill:#8fced6}.violet{fill:#b3a6e4}.gold{fill:#e7bd78}.small{font-size:16px}.label{font-size:19px}</style>
<rect width="1280" height="100%" rx="20" fill="#080f1b"/>
<text x="40" y="56" font-size="29">One workspace. Three trust boundaries.</text>
<text x="40" y="88" class="muted small">Illustrative policy map / selected recipients, not proof of delivery</text><rect x="40" y="123" width="380" height="330" rx="14" fill="#101e31" stroke="#25354b"/><text x="60" y="160" font-size="24">work</text><text x="60" y="184" class="small muted">Isolated domain / 3 projects</text><rect x="58" y="206" width="344" height="64" rx="8" fill="#0c1727" stroke="#435873"/><text x="73" y="232" class="label">atlas-api</text><text x="73" y="254" class="small muted">Backend / Python</text><text x="380" y="233" text-anchor="end" class="violet small">A + R</text><rect x="58" y="283" width="344" height="64" rx="8" fill="#0c1727" stroke="#435873"/><text x="73" y="309" class="label">atlas-web</text><text x="73" y="331" class="small muted">Frontend + contract tests</text><text x="380" y="310" text-anchor="end" class="violet small">A</text><rect x="58" y="360" width="344" height="64" rx="8" fill="#0c1727" stroke="#435873"/><text x="73" y="386" class="label">team-docs</text><text x="73" y="408" class="small muted">Product documentation</text><rect x="450" y="123" width="380" height="330" rx="14" fill="#101e31" stroke="#25354b"/><text x="470" y="160" font-size="24">research</text><text x="470" y="184" class="small muted">Isolated domain / 2 projects</text><rect x="468" y="206" width="344" height="64" rx="8" fill="#0c1727" stroke="#435873"/><text x="483" y="232" class="label">eval-lab</text><text x="483" y="254" class="small muted">Evaluation / Python</text><text x="790" y="233" text-anchor="end" class="violet small">R</text><rect x="468" y="283" width="344" height="64" rx="8" fill="#0c1727" stroke="#435873"/><text x="483" y="309" class="label">model-notes</text><text x="483" y="331" class="small muted">Research notes</text><rect x="860" y="123" width="380" height="330" rx="14" fill="#101e31" stroke="#25354b"/><text x="880" y="160" font-size="24">tools</text><text x="880" y="184" class="small muted">Isolated domain / 2 projects</text><rect x="878" y="206" width="344" height="64" rx="8" fill="#0c1727" stroke="#435873"/><text x="893" y="232" class="label">release-tools</text><text x="893" y="254" class="small muted">Automation / Python</text><text x="1200" y="233" text-anchor="end" class="violet small">R</text><rect x="878" y="283" width="344" height="64" rx="8" fill="#0c1727" stroke="#435873"/><text x="893" y="309" class="label">dotfiles</text><text x="893" y="331" class="small muted">Developer configuration</text><path d="M60 496H1218" stroke="#b3a6e4" stroke-dasharray="5 6"/>
<rect x="40" y="514" width="1200" height="97" rx="12" fill="#101e31" stroke="#435873"/>
<circle cx="70" cy="548" r="14" fill="#b3a6e4"/><text x="70" y="554" text-anchor="middle" style="fill:#080f1b" class="small">R</text>
<text x="96" y="555" class="label violet">release-kit</text><text x="290" y="555" class="label">atlas-api + eval-lab + release-tools</text>
<text x="60" y="588" class="small muted">Home: work / explicit grant across three domains / all other projects excluded</text>
<rect x="40" y="627" width="770" height="96" rx="12" fill="#101e31" stroke="#435873"/>
<circle cx="70" cy="661" r="14" fill="#b3a6e4"/><text x="70" y="667" text-anchor="middle" style="fill:#080f1b" class="small">A</text>
<text x="96" y="668" class="label violet">api-contract</text><text x="290" y="668" class="label">atlas-api + atlas-web</text>
<text x="60" y="700" class="small muted">Home: work / selected recipients / team-docs excluded</text>
<rect x="836" y="627" width="404" height="96" rx="12" fill="#0c1727" stroke="#e7bd78" stroke-dasharray="3 5"/>
<text x="858" y="665" class="label gold">scratch / unenrolled</text>
<text x="858" y="699" class="small muted">Local memory only. No shared pulls.</text>
<text x="40" y="770" class="cyan label">Verify the claim → approve its audience → pull in each recipient</text>
<text x="40" y="805" class="muted small">No group: domain + scope decide relevance. With recipients: only granted group members, still subject to relevance.</text>
</svg>