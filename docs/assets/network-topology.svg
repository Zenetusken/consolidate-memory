<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc">
<title id="title">A memory network with deliberate boundaries</title><desc id="desc">Fictional local topology. Three isolated domains: work holds atlas-api, atlas-web and team-docs; research holds eval-lab and model-notes; tools holds release-tools and dotfiles. Every drawn route is a delivery route. Group api-contract, home domain work, opens one gate into work and reaches atlas-api and atlas-web; team-docs is not reached. Group release-kit, home domain work, opens one gate into each of the three domains and reaches atlas-api, eval-lab and release-tools; atlas-web, team-docs, model-notes and dotfiles are not reached by it. Every gate still passes a relevance filter on stack and scope. The scratch repo stays unenrolled with no route into any domain. Selected recipients only, not proof of delivery.</desc>
<style>
text{font-family:'Segoe UI',Verdana,Arial,sans-serif}
.ink{fill:#e9f1f8}.inf{fill:#8296ad}.mid{fill:#b9c9da}
.cy{fill:#63d3e8}.vi{fill:#a999f5}
.zone{fill:#080e18;stroke:#1f3046}
.node{fill:#0f1c2e;stroke:#2c4059}
.chip{fill:#0a1524;stroke:#1f3046}
.glow{fill:none;stroke:#63d3e8;stroke-width:6;stroke-opacity:.13;stroke-linejoin:round;stroke-linecap:round}
.route{fill:none;stroke:#63d3e8;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sever{fill:none;stroke:#2c4059;stroke-width:1.5;stroke-dasharray:4 5}
.xh{fill:none;stroke:#f58f7a;stroke-width:2;stroke-linecap:round}
.fun{fill:#f0bd6a}
.t{font-size:30px}.h{font-size:24px}.n{font-size:19px}.m{font-size:14px}.s{font-size:13.5px}.c{font-size:13px}.f{font-size:17px}.l{font-size:20px}
</style>
<rect width="1280" height="840" rx="20" fill="#04070e"/>
<text x="40" y="56" class="ink t">One workspace. Three trust boundaries.</text>
<text x="40" y="86" class="inf m">Illustrative policy map of selected recipients — not proof of delivery.</text>

<rect x="40" y="132" width="378" height="308" rx="14" class="zone"/>
<text x="60" y="170" class="ink h">work</text><text x="60" y="194" class="inf s">Isolated domain &#183; 3 projects</text>
<rect x="450" y="132" width="378" height="236" rx="14" class="zone"/>
<text x="470" y="170" class="ink h">research</text><text x="470" y="194" class="inf s">Isolated domain &#183; 2 projects</text>
<rect x="860" y="132" width="378" height="236" rx="14" class="zone"/>
<text x="880" y="170" class="ink h">tools</text><text x="880" y="194" class="inf s">Isolated domain &#183; 2 projects</text>

<rect x="58" y="208" width="342" height="60" rx="9" class="node"/><text x="74" y="235" class="ink n">atlas-api</text><text x="74" y="255" class="inf s">Backend / Python</text>
<rect x="58" y="280" width="342" height="60" rx="9" class="node"/><text x="74" y="307" class="ink n">atlas-web</text><text x="74" y="327" class="inf s">Frontend + contract tests</text>
<rect x="58" y="352" width="342" height="60" rx="9" class="node"/><text x="74" y="379" class="ink n">team-docs</text><text x="74" y="399" class="inf s">Product documentation</text>
<rect x="468" y="208" width="342" height="60" rx="9" class="node"/><text x="484" y="235" class="ink n">eval-lab</text><text x="484" y="255" class="inf s">Evaluation / Python</text>
<rect x="468" y="280" width="342" height="60" rx="9" class="node"/><text x="484" y="307" class="ink n">model-notes</text><text x="484" y="327" class="inf s">Research notes</text>
<rect x="878" y="208" width="342" height="60" rx="9" class="node"/><text x="894" y="235" class="ink n">release-tools</text><text x="894" y="255" class="inf s">Automation / Python</text>
<rect x="878" y="280" width="342" height="60" rx="9" class="node"/><text x="894" y="307" class="ink n">dotfiles</text><text x="894" y="327" class="inf s">Developer configuration</text>

<rect x="268" y="371" width="118" height="22" rx="11" class="chip"/><path d="M276 377l10 10M286 377l-10 10" class="xh" stroke-width="1.6"/><text x="292" y="386" class="inf c">not reached</text>
<rect x="678" y="299" width="118" height="22" rx="11" class="chip"/><path d="M686 305l10 10M696 305l-10 10" class="xh" stroke-width="1.6"/><text x="702" y="314" class="inf c">not reached</text>
<rect x="1088" y="299" width="118" height="22" rx="11" class="chip"/><path d="M1096 305l10 10M1106 305l-10 10" class="xh" stroke-width="1.6"/><text x="1112" y="314" class="inf c">not reached</text>

<g class="glow"><path d="M49 500V238M49 500H190M190 500V532M409 500H869M409 500V238M459 500V238M869 500V238M639 500V532"/></g>
<g class="route"><path d="M49 500V238M49 500H190M190 500V532M49 238H58M49 310H58"/><path d="M409 500H869M409 500V238M459 500V238M869 500V238M639 500V532M409 238H400M459 238H468M869 238H878"/></g>

<rect x="42" y="437" width="14" height="6" fill="#04070e"/><path d="M42 434h14l-5.5 6v3.5l-3 2.5v-6z" class="fun"/>
<rect x="402" y="437" width="14" height="6" fill="#04070e"/><path d="M402 434h14l-5.5 6v3.5l-3 2.5v-6z" class="fun"/>
<rect x="452" y="365" width="14" height="6" fill="#04070e"/><path d="M452 362h14l-5.5 6v3.5l-3 2.5v-6z" class="fun"/>
<rect x="862" y="365" width="14" height="6" fill="#04070e"/><path d="M862 362h14l-5.5 6v3.5l-3 2.5v-6z" class="fun"/>

<rect x="40" y="532" width="300" height="86" rx="12" class="node"/>
<path d="M66 551l9 9-9 9-9-9z" class="cy"/>
<text x="84" y="565" class="ink l">api-contract</text>
<text x="64" y="588" class="mid s">atlas-api + atlas-web</text>
<text x="64" y="608" class="inf s">home: work &#183; stays inside the domain</text>

<rect x="439" y="532" width="400" height="86" rx="12" class="node"/>
<path d="M465 551l9 9-9 9-9-9z" class="vi"/>
<text x="483" y="565" class="ink l">release-kit</text>
<text x="463" y="588" class="mid s">atlas-api + eval-lab + release-tools</text>
<text x="463" y="608" class="inf s">home: work &#183; one gate into each domain</text>

<rect x="1000" y="532" width="240" height="86" rx="12" class="node"/>
<path d="M1020 554l12 12M1032 554l-12 12" class="xh"/>
<text x="1056" y="565" class="ink l">scratch</text>
<text x="1024" y="588" class="mid s">unenrolled</text>
<text x="1024" y="608" class="inf s">local memory only</text>
<path d="M1120 532V394" class="sever"/><path d="M1113 375l14 14M1127 375l-14 14" class="xh"/>

<path d="M40 654h26" class="route"/><text x="76" y="660" class="inf m">delivery route — a group reaching a project</text>
<path d="M440 648h14l-5.5 6v3.5l-3 2.5v-6z" class="fun"/><text x="464" y="660" class="inf m">relevance gate — stack and scope still apply</text>
<path d="M590 677l14 14M604 677l-14 14" class="xh"/><text x="614" y="690" class="inf m">no route — not reached by any group</text>
<rect x="920" y="675" width="24" height="18" rx="5" fill="none" stroke="#1f3046"/><text x="954" y="690" class="inf m">isolated domain boundary</text>

<text x="40" y="726" class="cy f">Verify the claim &#8594; approve its audience &#8594; pull in each recipient.</text>
<text x="40" y="754" class="inf m">No group: domain + scope decide relevance. With recipients: only granted group members, still subject to relevance.</text>
<text x="40" y="782" class="inf m">A domain behaves like a VLAN — projects inside share policy, and nothing crosses except through an explicit, recorded gate.</text>
</svg>
